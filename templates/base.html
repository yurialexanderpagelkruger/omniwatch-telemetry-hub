<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniWatch — {{ t('app_tagline') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-light.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">◈</span>
            <span class="brand-name">OmniWatch</span>
            <span class="brand-sub">{{ t('app_tagline') }}</span>
        </div>
        <nav class="nav">
            <a href="{{ url_for('dashboard') }}">{{ t('nav_dashboard') }}</a>
            <a href="/api/summary" target="_blank">{{ t('nav_api') }}</a>
            <a href="/health" target="_blank">{{ t('nav_health') }}</a>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">☀️</button>
            <select id="lang-select" class="lang-select" aria-label="Language">
                <option value="en">EN</option>
                <option value="es">ES</option>
                <option value="pt">PT</option>
            </select>
        </nav>
    </header>
    <main class="container">
        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <span>{{ t('footer') }}</span>
    </footer>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        document.getElementById("theme-toggle").addEventListener("click", function () {
            window.omniwatchTheme.toggle();
        });
        document.getElementById("lang-select").addEventListener("change", function (e) {
            window.omniwatchLang.set(e.target.value);
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
